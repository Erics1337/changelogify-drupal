# Admin routes
changelogify.dashboard:
  path: '/admin/config/development/changelogify'
  defaults:
    _controller: '\Drupal\changelogify\Controller\DashboardController::dashboard'
    _title: 'Changelogify'
  requirements:
    _permission: 'administer changelogify'

changelogify.settings:
  path: '/admin/config/development/changelogify/settings'
  defaults:
    _form: '\Drupal\changelogify\Form\SettingsForm'
    _title: 'Changelogify Settings'
  requirements:
    _permission: 'administer changelogify'

changelogify.generate_release:
  path: '/admin/config/development/changelogify/generate'
  defaults:
    _form: '\Drupal\changelogify\Form\GenerateReleaseForm'
    _title: 'Generate Release'
  requirements:
    _permission: 'manage changelogify releases'

changelogify.release_provenance:
  path: '/admin/content/changelogify/releases/{changelogify_release}/provenance'
  defaults:
    _controller: '\Drupal\changelogify\Controller\ReleaseProvenanceController::view'
    _title: 'Release provenance'
  requirements:
    _permission: 'manage changelogify releases'
  options:
    parameters:
      changelogify_release:
        type: entity:changelogify_release

changelogify.event_detail:
  path: '/admin/content/changelogify/events/{changelogify_event}'
  defaults:
    _controller: '\Drupal\changelogify\Controller\EventExplorerController::view'
    _title: 'Event details'
  requirements:
    _permission: 'administer changelogify'
  options:
    parameters:
      changelogify_event:
        type: entity:changelogify_event

# Public routes
changelogify.changelog:
  path: '/changelog'
  defaults:
    _controller: '\Drupal\changelogify\Controller\ChangelogController::listing'
    _title: 'Changelog'
  requirements:
    _access: 'TRUE'

changelogify.changelog_release:
  path: '/changelog/{release_slug}'
  defaults:
    _controller: '\Drupal\changelogify\Controller\ChangelogController::view'
    _title_callback: '\Drupal\changelogify\Controller\ChangelogController::title'
  requirements:
    _access: 'TRUE'
    release_slug: '[a-z][a-z0-9-]{0,127}'

changelogify.changelog_release_legacy:
  path: '/changelog/{changelogify_release}'
  defaults:
    _controller: '\Drupal\changelogify\Controller\ChangelogController::legacyRedirect'
    _title: 'Release'
  requirements:
    _permission: 'view changelogify releases'
    changelogify_release: '\d+'
  options:
    parameters:
      changelogify_release:
        type: entity:changelogify_release

changelogify.feed_rss:
  path: '/changelog/feed.rss'
  defaults:
    _controller: '\Drupal\changelogify\Controller\FeedController::rss'
  requirements:
    _permission: 'view changelogify releases'

changelogify.feed_atom:
  path: '/changelog/feed.atom'
  defaults:
    _controller: '\Drupal\changelogify\Controller\FeedController::atom'
  requirements:
    _permission: 'view changelogify releases'

changelogify.api_v1_releases:
  path: '/changelog/api/v1/releases'
  defaults:
    _controller: '\Drupal\changelogify\Controller\ReleaseApiController::collection'
  requirements:
    _permission: 'view changelogify releases'

changelogify.api_v1_release:
  path: '/changelog/api/v1/releases/{release_slug}'
  defaults:
    _controller: '\Drupal\changelogify\Controller\ReleaseApiController::detail'
  requirements:
    _permission: 'view changelogify releases'
    release_slug: '[a-z][a-z0-9-]{0,127}'
