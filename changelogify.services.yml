services:
  _defaults:
    autowire: true
    autoconfigure: true

  Drupal\changelogify\EventManager:
    class: Drupal\changelogify\EventManager

  Drupal\changelogify\ReleaseGenerator:
    class: Drupal\changelogify\ReleaseGenerator

  Drupal\changelogify\ReleaseItemNormalizer:
    arguments: ['@uuid']

  Drupal\changelogify\EventManagerInterface:
    alias: Drupal\changelogify\EventManager

  Drupal\changelogify\EventSource\EventSourceRecorder:
    class: Drupal\changelogify\EventSource\EventSourceRecorder

  Drupal\changelogify\EventSource\EventSourceRecorderInterface:
    alias: Drupal\changelogify\EventSource\EventSourceRecorder

  Drupal\changelogify\EventSource\ContentCapturePolicy:
    class: Drupal\changelogify\EventSource\ContentCapturePolicy

  Drupal\changelogify\EventSource\ContentCapturePolicyInterface:
    alias: Drupal\changelogify\EventSource\ContentCapturePolicy

  Drupal\changelogify\EntityDifference\EntityDifferenceService:
    class: Drupal\changelogify\EntityDifference\EntityDifferenceService

  Drupal\changelogify\EntityDifference\EntityDifferenceServiceInterface:
    alias: Drupal\changelogify\EntityDifference\EntityDifferenceService

  Drupal\changelogify\ConfigClassifier\ConfigClassifier:
    class: Drupal\changelogify\ConfigClassifier\ConfigClassifier
    arguments:
      - !tagged_iterator changelogify.config_classifier

  Drupal\changelogify\ConfigClassifier\ConfigClassifierInterface:
    alias: Drupal\changelogify\ConfigClassifier\ConfigClassifier

  Drupal\changelogify\EventSource\EventSourceRegistry:
    class: Drupal\changelogify\EventSource\EventSourceRegistry
    arguments:
      - !tagged_iterator changelogify.event_source

  Drupal\changelogify\EventSource\EventSourceRegistryInterface:
    alias: Drupal\changelogify\EventSource\EventSourceRegistry

  Drupal\changelogify\EventSource\ContentEventSource:
    class: Drupal\changelogify\EventSource\ContentEventSource
    tags:
      - { name: changelogify.event_source }

  Drupal\changelogify\EventSource\ModuleEventSource:
    class: Drupal\changelogify\EventSource\ModuleEventSource
    tags:
      - { name: changelogify.event_source }

  Drupal\changelogify\EventSource\UserEventSource:
    class: Drupal\changelogify\EventSource\UserEventSource
    tags:
      - { name: changelogify.event_source }

  Drupal\changelogify\ReleaseGeneratorInterface:
    alias: Drupal\changelogify\ReleaseGenerator

  Drupal\changelogify\Hook\ChangelogifyHooks:
    class: Drupal\changelogify\Hook\ChangelogifyHooks

  Drupal\changelogify\Routing\RouteSubscriber:
    arguments: ['@config.factory']
    tags:
      - { name: event_subscriber }

  # Aliases for interface injection
  changelogify.event_manager:
    alias: Drupal\changelogify\EventManager

  changelogify.release_generator:
    alias: Drupal\changelogify\ReleaseGenerator
