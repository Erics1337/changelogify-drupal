changelogify.settings:
  type: config_object
  label: Changelogify settings
  mapping:
    changelog_path:
      type: string
      label: Public changelog path
    translation_fallback:
      type: string
      label: Missing release translation behavior
    track_content:
      type: boolean
      label: Track content changes
    track_unpublished_content:
      type: boolean
      label: Track unpublished content
    track_modules:
      type: boolean
      label: Track module changes
    track_users:
      type: boolean
      label: Track user changes
    event_sources:
      type: sequence
      label: Event source settings
      sequence:
        type: mapping
        label: Event source
        mapping:
          enabled:
            type: boolean
            label: Enabled
    content_capture:
      type: mapping
      label: Content capture policy
      mapping:
        entity_types:
          type: sequence
          label: Entity type policies
          sequence:
            type: mapping
            label: Entity type policy
            mapping:
              enabled:
                type: boolean
                label: Enabled
              default_bundle_enabled:
                type: boolean
                label: Enable unconfigured bundles
              bundles:
                type: sequence
                label: Bundle policies
                sequence:
                  type: boolean
                  label: Enabled
    event_retention_days:
      type: integer
      label: Event retention period in days
    provenance_retention_days:
      type: integer
      label: Minimal release provenance retention period in days
    config_import:
      type: mapping
      label: Configuration import capture
      mapping:
        include_sensitive:
          type: boolean
          label: Include sensitive configuration names
        excluded_patterns:
          type: sequence
          label: Excluded configuration name patterns
          sequence:
            type: string
            label: Pattern

block.settings.changelogify_latest_release:
  type: block_settings
  label: 'Latest Changelogify release block settings'
  mapping:
    item_count: { type: integer, label: 'Number of releases' }
    show_date: { type: boolean, label: 'Show release date' }
    show_version: { type: boolean, label: 'Show version' }
    sections:
      type: sequence
      label: 'Included sections'
      sequence: { type: boolean, label: 'Include section' }
    show_changelog_link: { type: boolean, label: 'Show full changelog link' }

block.settings.changelogify_recent_releases:
  type: block_settings
  label: 'Recent Changelogify releases block settings'
  mapping:
    item_count: { type: integer, label: 'Number of releases' }
    show_date: { type: boolean, label: 'Show release date' }
    show_version: { type: boolean, label: 'Show version' }
    sections:
      type: sequence
      label: 'Included sections'
      sequence: { type: boolean, label: 'Include section' }
    show_changelog_link: { type: boolean, label: 'Show full changelog link' }
